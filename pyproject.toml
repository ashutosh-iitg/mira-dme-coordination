[project]
name = "mira-dme"
version = "0.1.0"
description = "Durable DME coordination prototype: Temporal workflows + call queue with placeholder voice agents"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.8",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mira"]
